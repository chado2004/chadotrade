<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChadoTrade PRO</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Exo+2:wght@300;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #070a0f;
    --panel: #0d1117;
    --border: #1a2535;
    --gold: #f0b429;
    --gold2: #ffd166;
    --cyan: #00e5ff;
    --green: #00ff88;
    --red: #ff3d5a;
    --muted: #4a5568;
    --text: #e2e8f0;
    --mono: 'Share Tech Mono', monospace;
    --sans: 'Exo 2', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    padding: 16px;
    background-image:
      radial-gradient(ellipse at 20% 0%, rgba(240,180,41,0.05) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 100%, rgba(0,229,255,0.04) 0%, transparent 60%);
  }

  /* ── HEADER ── */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--border);
  }
  .logo {
    font-family: var(--sans);
    font-weight: 800;
    font-size: 1.3rem;
    letter-spacing: 1px;
  }
  .logo span { color: var(--gold); }
  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--muted);
    display: inline-block;
    margin-right: 6px;
    transition: background 0.3s;
  }
  .status-dot.connected { background: var(--green); box-shadow: 0 0 8px var(--green); animation: pulse 2s infinite; }
  .status-dot.error { background: var(--red); }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
  .status-label { font-family: var(--mono); font-size: 0.72rem; color: var(--muted); }

  /* ── CONNECT SECTION ── */
  .connect-box {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 16px;
  }
  .section-title {
    font-size: 0.65rem;
    font-family: var(--mono);
    letter-spacing: 2px;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 12px;
  }
  .input-row { display: flex; gap: 10px; }
  input[type="text"], input[type="password"] {
    flex: 1;
    background: #0a0f18;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 0.82rem;
    padding: 10px 14px;
    outline: none;
    transition: border-color 0.2s;
  }
  input:focus { border-color: var(--gold); }

  /* ── BUTTONS ── */
  .btn {
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-family: var(--sans);
    font-weight: 600;
    font-size: 0.85rem;
    padding: 10px 18px;
    transition: all 0.2s;
    letter-spacing: 0.5px;
  }
  .btn-gold {
    background: var(--gold);
    color: #000;
  }
  .btn-gold:hover { background: var(--gold2); transform: translateY(-1px); }
  .btn-outline {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
  }
  .btn-outline:hover { border-color: var(--cyan); color: var(--cyan); }
  .btn-green {
    background: var(--green);
    color: #000;
  }
  .btn-green:hover { filter: brightness(1.1); transform: translateY(-1px); }
  .btn-danger {
    background: transparent;
    border: 1px solid var(--red);
    color: var(--red);
  }
  .btn-danger:hover { background: rgba(255,61,90,0.1); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none !important; }
  .btn-full { width: 100%; }

  /* ── INSTRUMENT GRID ── */
  .instrument-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-bottom: 16px;
  }
  .instr-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 10px;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
  }
  .instr-card:hover { border-color: var(--gold); }
  .instr-card.active {
    border-color: var(--gold);
    background: rgba(240,180,41,0.08);
  }
  .instr-card .instr-name {
    font-family: var(--mono);
    font-size: 0.78rem;
    color: var(--gold);
    font-weight: bold;
  }
  .instr-card .instr-symbol {
    font-size: 0.62rem;
    color: var(--muted);
    margin-top: 2px;
  }

  /* ── TIMEFRAME BUTTONS ── */
  .tf-row {
    display: flex;
    gap: 6px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .tf-btn {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--muted);
    cursor: pointer;
    font-family: var(--mono);
    font-size: 0.72rem;
    padding: 6px 12px;
    transition: all 0.2s;
  }
  .tf-btn.active { border-color: var(--cyan); color: var(--cyan); background: rgba(0,229,255,0.06); }
  .tf-btn:hover { border-color: var(--cyan); color: var(--cyan); }

  /* ── ANALYSE BUTTON ── */
  .analyse-bar {
    display: flex;
    gap: 10px;
    margin-bottom: 16px;
    align-items: center;
  }
  #autoLabel {
    font-family: var(--mono);
    font-size: 0.7rem;
    color: var(--muted);
  }
  .toggle-row { display: flex; align-items: center; gap: 8px; }
  .toggle {
    width: 38px; height: 20px;
    background: var(--border);
    border-radius: 10px;
    cursor: pointer;
    position: relative;
    transition: background 0.2s;
  }
  .toggle.on { background: var(--green); }
  .toggle::after {
    content: '';
    position: absolute;
    width: 14px; height: 14px;
    background: #fff;
    border-radius: 50%;
    top: 3px; left: 3px;
    transition: left 0.2s;
  }
  .toggle.on::after { left: 21px; }

  /* ── SIGNAL CARD ── */
  .signal-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 16px;
    min-height: 80px;
    transition: border-color 0.3s;
  }
  .signal-card.buy { border-color: var(--green); background: rgba(0,255,136,0.04); }
  .signal-card.sell { border-color: var(--red); background: rgba(255,61,90,0.04); }
  .signal-card.loading { border-color: var(--gold); }

  .signal-direction {
    font-size: 1.8rem;
    font-weight: 800;
    letter-spacing: 2px;
  }
  .signal-direction.buy { color: var(--green); }
  .signal-direction.sell { color: var(--red); }

  .signal-meta {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-top: 14px;
  }
  .meta-box {
    background: #0a0f18;
    border-radius: 8px;
    padding: 10px;
    text-align: center;
  }
  .meta-label { font-size: 0.6rem; color: var(--muted); font-family: var(--mono); letter-spacing: 1px; text-transform: uppercase; }
  .meta-value { font-family: var(--mono); font-size: 0.92rem; margin-top: 3px; }
  .meta-value.entry { color: var(--gold); }
  .meta-value.sl { color: var(--red); }
  .meta-value.tp { color: var(--green); }

  .confluence-bar {
    margin-top: 14px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .conf-label { font-size: 0.65rem; color: var(--muted); font-family: var(--mono); white-space: nowrap; }
  .conf-track {
    flex: 1;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }
  .conf-fill {
    height: 100%;
    border-radius: 2px;
    background: linear-gradient(90deg, var(--red), var(--gold), var(--green));
    transition: width 0.5s ease;
  }
  .conf-score { font-family: var(--mono); font-size: 0.72rem; color: var(--text); }

  .rr-badge {
    display: inline-block;
    margin-top: 10px;
    padding: 3px 10px;
    background: rgba(0,229,255,0.1);
    border: 1px solid rgba(0,229,255,0.3);
    border-radius: 20px;
    font-family: var(--mono);
    font-size: 0.72rem;
    color: var(--cyan);
  }

  .signal-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-top: 10px;
  }
  .tag {
    padding: 2px 8px;
    background: rgba(240,180,41,0.1);
    border: 1px solid rgba(240,180,41,0.2);
    border-radius: 4px;
    font-family: var(--mono);
    font-size: 0.6rem;
    color: var(--gold);
  }

  /* ── HISTORY ── */
  .history-box {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .history-list { max-height: 180px; overflow-y: auto; }
  .history-list::-webkit-scrollbar { width: 3px; }
  .history-list::-webkit-scrollbar-track { background: transparent; }
  .history-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .hist-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
    font-family: var(--mono);
    font-size: 0.72rem;
  }
  .hist-item:last-child { border-bottom: none; }
  .hist-dir { font-weight: bold; }
  .hist-dir.BUY { color: var(--green); }
  .hist-dir.SELL { color: var(--red); }
  .hist-time { color: var(--muted); }

  /* ── LOADER ── */
  .loader {
    display: inline-block;
    width: 16px; height: 16px;
    border: 2px solid var(--border);
    border-top-color: var(--gold);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
    margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── TOAST ── */
  #toast {
    position: fixed;
    bottom: 20px; left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: #1a2535;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 20px;
    font-family: var(--mono);
    font-size: 0.78rem;
    transition: transform 0.3s;
    z-index: 999;
    white-space: nowrap;
  }
  #toast.show { transform: translateX(-50%) translateY(0); }

  /* ── MTF MINI TABLE ── */
  .mtf-row {
    display: flex;
    gap: 6px;
    margin-top: 12px;
  }
  .mtf-cell {
    flex: 1;
    background: #0a0f18;
    border-radius: 6px;
    padding: 6px 4px;
    text-align: center;
  }
  .mtf-tf { font-size: 0.6rem; color: var(--muted); font-family: var(--mono); }
  .mtf-bias { font-family: var(--mono); font-size: 0.72rem; margin-top: 2px; }
  .mtf-bias.BULLISH { color: var(--green); }
  .mtf-bias.BEARISH { color: var(--red); }
  .mtf-bias.RANGE { color: var(--muted); }

  .divider { border: none; border-top: 1px solid var(--border); margin: 14px 0; }

  /* no signal */
  .no-signal { color: var(--muted); font-family: var(--mono); font-size: 0.82rem; }
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="logo">Chado<span>Trade</span> PRO</div>
  <div>
    <span class="status-dot" id="statusDot"></span>
    <span class="status-label" id="statusLabel">DÉCONNECTÉ</span>
  </div>
</div>

<!-- CONNEXION -->
<div class="connect-box" id="connectBox">
  <div class="section-title">🔑 Connexion Deriv</div>
  <div class="input-row">
    <input type="password" id="tokenInput" placeholder="Token API Deriv (Read)" autocomplete="off">
    <button class="btn btn-gold" id="connectBtn" onclick="connectDeriv()">Connecter</button>
  </div>
  <div style="margin-top:8px; font-size:0.65rem; color:var(--muted); font-family:var(--mono);">
    🔗 Obtenir token: app.deriv.com → Paramètres → Tokens API → Read
  </div>
</div>

<!-- INSTRUMENTS -->
<div class="section-title">📊 Indices Synthétiques</div>
<div class="instrument-grid" id="instrGrid">
  <!-- généré dynamiquement -->
</div>

<!-- TIMEFRAMES -->
<div class="section-title">⏱ Timeframe Analyse</div>
<div class="tf-row" id="tfRow"></div>

<!-- ANALYSE -->
<div class="analyse-bar">
  <button class="btn btn-green" style="flex:1" id="analyseBtn" onclick="runAnalysis()" disabled>
    ⚡ Lancer Analyse
  </button>
  <div class="toggle-row">
    <div class="toggle" id="autoToggle" onclick="toggleAuto()"></div>
    <span id="autoLabel">Auto OFF</span>
  </div>
</div>

<!-- SIGNAL -->
<div class="signal-card" id="signalCard">
  <div class="no-signal">— Aucun signal actif —</div>
</div>

<!-- HISTORY -->
<div class="history-box">
  <div class="section-title">📋 Historique Signaux</div>
  <div class="history-list" id="historyList">
    <div class="no-signal" style="padding:6px 0">Aucun signal pour l'instant.</div>
  </div>
</div>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@deriv/deriv-api/dist/deriv-api.min.js"></script>
<script>
// ═══════════════════════════════════════════
//  CONFIG - INSTRUMENTS SYNTHÉTIQUES DERIV
// ═══════════════════════════════════════════
const INSTRUMENTS = [
  { name: "Step Index",       symbol: "stpRNG",   group: "step" },
  { name: "Step 200 (1)",     symbol: "STPRNG",   group: "step" },
  { name: "Multi Step 4",     symbol: "MULTISTEP4RNG", group: "step" },
  { name: "Volatility 10",    symbol: "R_10",     group: "vol" },
  { name: "Volatility 25",    symbol: "R_25",     group: "vol" },
  { name: "Volatility 50",    symbol: "R_50",     group: "vol" },
  { name: "Volatility 75",    symbol: "R_75",     group: "vol" },
  { name: "Volatility 100",   symbol: "R_100",    group: "vol" },
  { name: "Boom 300",         symbol: "BOOM300N", group: "crash" },
  { name: "Boom 500",         symbol: "BOOM500",  group: "crash" },
  { name: "Boom 1000",        symbol: "BOOM1000", group: "crash" },
  { name: "Crash 300",        symbol: "CRASH300N",group: "crash" },
  { name: "Crash 500",        symbol: "CRASH500", group: "crash" },
  { name: "Crash 1000",       symbol: "CRASH1000",group: "crash" },
  { name: "Range Break 100",  symbol: "RBRK100",  group: "range" },
  { name: "Range Break 200",  symbol: "RBRK200",  group: "range" },
  { name: "Jump 10",          symbol: "JD10",     group: "jump" },
  { name: "Jump 25",          symbol: "JD25",     group: "jump" },
  { name: "Jump 50",          symbol: "JD50",     group: "jump" },
  { name: "Jump 75",          symbol: "JD75",     group: "jump" },
  { name: "Jump 100",         symbol: "JD100",    group: "jump" },
];

const TF_OPTIONS = [
  { label: "M5",  seconds: 300 },
  { label: "M15", seconds: 900 },
  { label: "H1",  seconds: 3600 },
  { label: "H4",  seconds: 14400 },
];

// ═══════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════
let connection = null;
let selectedSymbol = "R_75";
let selectedTF = 300; // M5 entry
let autoMode = false;
let autoTimer = null;
let signalHistory = [];
let isConnected = false;

// ═══════════════════════════════════════════
//  INIT UI
// ═══════════════════════════════════════════
function initUI() {
  // Instrument cards
  const grid = document.getElementById("instrGrid");
  grid.innerHTML = "";
  INSTRUMENTS.forEach(inst => {
    const c = document.createElement("div");
    c.className = "instr-card" + (inst.symbol === selectedSymbol ? " active" : "");
    c.dataset.symbol = inst.symbol;
    c.innerHTML = `<div class="instr-name">${inst.name}</div><div class="instr-symbol">${inst.symbol}</div>`;
    c.onclick = () => selectInstrument(inst.symbol, c);
    grid.appendChild(c);
  });

  // TF buttons
  const tfRow = document.getElementById("tfRow");
  tfRow.innerHTML = "";
  TF_OPTIONS.forEach(tf => {
    const b = document.createElement("button");
    b.className = "tf-btn" + (tf.seconds === selectedTF ? " active" : "");
    b.textContent = tf.label;
    b.onclick = () => selectTF(tf.seconds, b);
    tfRow.appendChild(b);
  });
}

function selectInstrument(symbol, card) {
  selectedSymbol = symbol;
  document.querySelectorAll(".instr-card").forEach(c => c.classList.remove("active"));
  card.classList.add("active");
}

function selectTF(sec, btn) {
  selectedTF = sec;
  document.querySelectorAll(".tf-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
}

// ═══════════════════════════════════════════
//  CONNEXION DERIV
// ═══════════════════════════════════════════
async function connectDeriv() {
  const token = document.getElementById("tokenInput").value.trim();
  if (!token) { showToast("⚠️ Entre ton token API"); return; }

  const btn = document.getElementById("connectBtn");
  btn.disabled = true;
  btn.innerHTML = '<span class="loader"></span>';

  try {
    connection = new DerivAPI({ app_id: 1089, language: "FR" });
    await connection.authorize({ authorize: token });
    isConnected = true;
    setStatus("connected", "CONNECTÉ");
    document.getElementById("tokenInput").value = "";
    document.getElementById("analyseBtn").disabled = false;
    btn.textContent = "✓ OK";
    showToast("✅ Connecté à Deriv");
  } catch (e) {
    isConnected = false;
    setStatus("error", "ERREUR");
    btn.disabled = false;
    btn.textContent = "Connecter";
    showToast("❌ Token invalide: " + e.message);
  }
}

function setStatus(state, label) {
  const dot = document.getElementById("statusDot");
  dot.className = "status-dot " + state;
  document.getElementById("statusLabel").textContent = label;
}

// ═══════════════════════════════════════════
//  FETCH CANDLES
// ═══════════════════════════════════════════
async function fetchCandles(symbol, granularity, count = 60) {
  if (!isConnected) throw new Error("Non connecté");
  const response = await connection.candles({
    ticks_history: symbol,
    granularity: granularity,
    count: count,
    end: "latest",
    adjust_start_time: 1
  });
  return response.candles.map(c => ({
    open: parseFloat(c.open),
    high: parseFloat(c.high),
    low: parseFloat(c.low),
    close: parseFloat(c.close),
    epoch: c.epoch
  }));
}

// ═══════════════════════════════════════════
//  ANALYSE MTF + ICT/SMC
// ═══════════════════════════════════════════
function getBias(candles) {
  const l = candles[candles.length - 1];
  const p = candles[candles.length - 2];
  if (l.close > p.high) return "BULLISH";
  if (l.close < p.low) return "BEARISH";
  return "RANGE";
}

function confirmStructure(candles, bias) {
  const last3 = candles.slice(-3);
  if (bias === "BULLISH") {
    return last3[2].high > last3[1].high && last3[1].high > last3[0].high;
  }
  if (bias === "BEARISH") {
    return last3[2].low < last3[1].low && last3[1].low < last3[0].low;
  }
  return false;
}

function detectFVG(candles) {
  for (let i = 2; i < candles.length; i++) {
    const c1 = candles[i - 2], c3 = candles[i];
    if (c1.high < c3.low) return { type: "BULLISH_FVG", level: (c1.high + c3.low) / 2 };
    if (c1.low > c3.high) return { type: "BEARISH_FVG", level: (c1.low + c3.high) / 2 };
  }
  return null;
}

function detectOB(candles) {
  const len = candles.length;
  for (let i = len - 5; i < len - 1; i++) {
    const c = candles[i];
    if (c.close < c.open) {
      const next = candles[i + 1];
      if (next && next.close > c.high) return { type: "BULLISH_OB", high: c.high, low: c.low };
    }
    if (c.close > c.open) {
      const next = candles[i + 1];
      if (next && next.close < c.low) return { type: "BEARISH_OB", high: c.high, low: c.low };
    }
  }
  return null;
}

function liquiditySweep(candles) {
  const l = candles[candles.length - 1];
  const prev = candles.slice(-10, -1);
  const maxHigh = Math.max(...prev.map(c => c.high));
  const minLow = Math.min(...prev.map(c => c.low));
  if (l.high > maxHigh && l.close < maxHigh) return "SWEEP_HIGH";
  if (l.low < minLow && l.close > minLow) return "SWEEP_LOW";
  return null;
}

function detectEMA(candles, period = 21) {
  const k = 2 / (period + 1);
  let ema = candles[0].close;
  for (let i = 1; i < candles.length; i++) {
    ema = candles[i].close * k + ema * (1 - k);
  }
  return ema;
}

function detectMSS(candles, bias) {
  const last = candles[candles.length - 1];
  const prev = candles.slice(-6, -1);
  if (bias === "BULLISH") {
    const swingLow = Math.min(...prev.map(c => c.low));
    return last.low < swingLow && last.close > swingLow;
  }
  if (bias === "BEARISH") {
    const swingHigh = Math.max(...prev.map(c => c.high));
    return last.high > swingHigh && last.close < swingHigh;
  }
  return false;
}

async function multiTimeframeAnalysis(symbol) {
  // Fetch all timeframes
  const [H4, H1, M15, M5] = await Promise.all([
    fetchCandles(symbol, 14400, 60),
    fetchCandles(symbol, 3600, 60),
    fetchCandles(symbol, 900, 60),
    fetchCandles(symbol, 300, 60),
  ]);

  const biasH4 = getBias(H4);
  const biasH1 = getBias(H1);
  const biasM15 = getBias(M15);
  const biasM5 = getBias(M5);

  const mtfData = { H4: biasH4, H1: biasH1, M15: biasM15, M5: biasM5 };

  // Filtre 1: H4 doit avoir une direction claire
  if (biasH4 === "RANGE") return { signal: null, mtf: mtfData, reason: "H4 en range" };

  // Filtre 2: H1 doit confirmer H4
  if (biasH1 !== biasH4 && biasH1 !== "RANGE") return { signal: null, mtf: mtfData, reason: "H1 contre H4" };

  // Filtre 3: Alignment M15
  if (biasM15 !== biasH4 && biasM15 !== "RANGE") return { signal: null, mtf: mtfData, reason: "M15 non aligné" };

  // Confluences
  const tags = [];
  let confluences = 0;
  const direction = biasH4;

  // Structure H4 confirmée
  if (confirmStructure(H4, direction)) { confluences++; tags.push("H4 BOS"); }

  // Liquidity sweep M15
  const sweep = liquiditySweep(M15);
  if ((direction === "BULLISH" && sweep === "SWEEP_LOW") || (direction === "BEARISH" && sweep === "SWEEP_HIGH")) {
    confluences++; tags.push("LIQUIDITY SWEEP");
  }

  // FVG M15
  const fvg = detectFVG(M15);
  if (fvg && ((direction === "BULLISH" && fvg.type === "BULLISH_FVG") || (direction === "BEARISH" && fvg.type === "BEARISH_FVG"))) {
    confluences++; tags.push("FVG");
  }

  // Order Block M15
  const ob = detectOB(M15);
  if (ob && ((direction === "BULLISH" && ob.type === "BULLISH_OB") || (direction === "BEARISH" && ob.type === "BEARISH_OB"))) {
    confluences++; tags.push("ORDER BLOCK");
  }

  // EMA M5
  const ema21 = detectEMA(M5, 21);
  const lastM5 = M5[M5.length - 1];
  if ((direction === "BULLISH" && lastM5.close > ema21) || (direction === "BEARISH" && lastM5.close < ema21)) {
    confluences++; tags.push("EMA 21");
  }

  // MSS M5
  if (detectMSS(M5, direction)) { confluences++; tags.push("MSS"); }

  // M5 entry signal
  const prevM5 = M5[M5.length - 2];
  let entrySignal = null;
  if (direction === "BULLISH" && lastM5.close > prevM5.high) { entrySignal = "BUY"; confluences++; tags.push("M5 ENTRY"); }
  if (direction === "BEARISH" && lastM5.close < prevM5.low) { entrySignal = "SELL"; confluences++; tags.push("M5 ENTRY"); }

  if (!entrySignal) return { signal: null, mtf: mtfData, reason: "Pas d'entrée M5", confluences };

  // Minimum 4 confluences
  if (confluences < 4) return { signal: null, mtf: mtfData, reason: `Confluences insuffisantes (${confluences}/4)`, confluences };

  // Calcul SL/TP
  const entry = lastM5.close;
  let sl, tp1, tp2, tp3;

  if (direction === "BULLISH") {
    sl = Math.min(...M15.slice(-5).map(c => c.low));
    const risk = entry - sl;
    tp1 = entry + risk * 1.5;
    tp2 = entry + risk * 2.5;
    tp3 = entry + risk * 3.5;
  } else {
    sl = Math.max(...M15.slice(-5).map(c => c.high));
    const risk = sl - entry;
    tp1 = entry - risk * 1.5;
    tp2 = entry - risk * 2.5;
    tp3 = entry - risk * 3.5;
  }

  const risk = Math.abs(entry - sl);
  const rr = risk > 0 ? (Math.abs(tp2 - entry) / risk).toFixed(1) : "N/A";

  return {
    signal: { direction: entrySignal, entry, sl, tp1, tp2, tp3, rr, confluences, tags },
    mtf: mtfData,
    reason: null
  };
}

// ═══════════════════════════════════════════
//  RUN
// ═══════════════════════════════════════════
async function runAnalysis() {
  if (!isConnected) { showToast("❌ Connecte-toi d'abord"); return; }

  const card = document.getElementById("signalCard");
  card.className = "signal-card loading";
  card.innerHTML = `<span class="loader"></span> Analyse en cours...`;

  try {
    const result = await multiTimeframeAnalysis(selectedSymbol);
    renderSignal(result);
  } catch (e) {
    card.className = "signal-card";
    card.innerHTML = `<div class="no-signal">⚠️ Erreur: ${e.message}</div>`;
    showToast("⚠️ " + e.message);
  }
}

function renderSignal(result) {
  const card = document.getElementById("signalCard");
  const { signal, mtf, reason, confluences } = result;

  const mtfHTML = `
    <div class="mtf-row">
      ${["H4","H1","M15","M5"].map(tf => `
        <div class="mtf-cell">
          <div class="mtf-tf">${tf}</div>
          <div class="mtf-bias ${mtf[tf]}">${mtf[tf] === "BULLISH" ? "▲" : mtf[tf] === "BEARISH" ? "▼" : "—"}</div>
        </div>
      `).join("")}
    </div>`;

  if (!signal) {
    card.className = "signal-card";
    card.innerHTML = `
      <div class="no-signal">❌ Aucun trade — ${reason || "conditions non remplies"}</div>
      ${confluences !== undefined ? `<div style="font-family:var(--mono);font-size:0.65rem;color:var(--muted);margin-top:6px">Confluences: ${confluences}/4 min</div>` : ""}
      ${mtfHTML}
    `;
    return;
  }

  const isBuy = signal.direction === "BUY";
  card.className = `signal-card ${isBuy ? "buy" : "sell"}`;

  const dp = (v) => {
    if (typeof v !== "number") return "N/A";
    return v < 1 ? v.toFixed(4) : v.toFixed(2);
  };

  const confPct = Math.min(100, Math.round((signal.confluences / 8) * 100));
  const tagsHTML = signal.tags.map(t => `<span class="tag">${t}</span>`).join("");

  card.innerHTML = `
    <div class="signal-direction ${isBuy ? "buy" : "sell"}">${signal.direction}</div>
    <div style="font-family:var(--mono);font-size:0.65rem;color:var(--muted);margin-top:2px">${selectedSymbol} · ${new Date().toLocaleTimeString("fr")}</div>
    <div class="signal-meta">
      <div class="meta-box"><div class="meta-label">ENTRY</div><div class="meta-value entry">${dp(signal.entry)}</div></div>
      <div class="meta-box"><div class="meta-label">SL</div><div class="meta-value sl">${dp(signal.sl)}</div></div>
      <div class="meta-box"><div class="meta-label">TP2</div><div class="meta-value tp">${dp(signal.tp2)}</div></div>
    </div>
    <div style="margin-top:10px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-family:var(--mono);font-size:0.68rem;color:var(--muted)">
      <span>TP1: <span style="color:var(--green)">${dp(signal.tp1)}</span></span>
      <span>TP2: <span style="color:var(--green)">${dp(signal.tp2)}</span></span>
      <span>TP3: <span style="color:var(--green)">${dp(signal.tp3)}</span></span>
    </div>
    <span class="rr-badge">R:R 1:${signal.rr}</span>
    <div class="confluence-bar">
      <span class="conf-label">CONFLUENCES</span>
      <div class="conf-track"><div class="conf-fill" style="width:${confPct}%"></div></div>
      <span class="conf-score">${signal.confluences}</span>
    </div>
    <div class="signal-tags">${tagsHTML}</div>
    ${mtfHTML}
  `;

  addToHistory(signal);
}

function addToHistory(signal) {
  const list = document.getElementById("historyList");
  signalHistory.unshift(signal);
  if (signalHistory.length > 20) signalHistory.pop();

  list.innerHTML = signalHistory.map(s => `
    <div class="hist-item">
      <span class="hist-dir ${s.direction}">${s.direction}</span>
      <span style="color:var(--muted);font-size:0.65rem">${selectedSymbol}</span>
      <span style="color:var(--gold)">E:${s.entry < 1 ? s.entry.toFixed(4) : s.entry.toFixed(2)}</span>
      <span style="color:var(--green)">TP:${s.tp2 < 1 ? s.tp2.toFixed(4) : s.tp2.toFixed(2)}</span>
      <span class="hist-time">${new Date().toLocaleTimeString("fr",{hour:"2-digit",minute:"2-digit"})}</span>
    </div>
  `).join("");
}

// ═══════════════════════════════════════════
//  AUTO MODE
// ═══════════════════════════════════════════
function toggleAuto() {
  autoMode = !autoMode;
  const toggle = document.getElementById("autoToggle");
  const label = document.getElementById("autoLabel");
  toggle.className = "toggle" + (autoMode ? " on" : "");
  label.textContent = autoMode ? "Auto 5min" : "Auto OFF";
  label.style.color = autoMode ? "var(--green)" : "var(--muted)";

  if (autoMode) {
    if (isConnected) runAnalysis();
    autoTimer = setInterval(() => { if (isConnected) runAnalysis(); }, 5 * 60 * 1000);
    showToast("🔄 Auto-analyse activée (5 min)");
  } else {
    clearInterval(autoTimer);
    showToast("⏹ Auto-analyse désactivée");
  }
}

// ═══════════════════════════════════════════
//  TOAST
// ═══════════════════════════════════════════
let toastTimer = null;
function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 3000);
}

// ═══════════════════════════════════════════
//  BOOT
// ═══════════════════════════════════════════
initUI();
</script>
</body>
</html>
